<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Header blur probe</title>
<style>
  :root { --safe: env(safe-area-inset-top, 0px); --bar: 3.5rem; --h: calc(var(--bar) + var(--safe)); }
  * { box-sizing: border-box; }
  body { margin:0; background:#0A0A0A; color:#fff; font:14px -apple-system,sans-serif; }
  .page { padding-top: calc(var(--h) + 8px); }
  .stripe { height:60px; background:linear-gradient(90deg,#2b6cb0,#7f4fd8,#c05621); margin:0 0 2px; }
  .case { position:relative; border-bottom:1px solid #333; padding-bottom:18px; margin-bottom:26px; }
  .caseLabel { position:relative; z-index:5; padding:6px 12px; font-weight:700; color:#7ee787; }
  /* Each case reproduces the header at the top of a scroll area */
  .win { position:relative; height:150px; overflow:hidden; }
  .content { position:absolute; inset:0; padding-top:4px; }
  .hdr { position:absolute; top:0; left:0; right:0; height:var(--h);
         display:flex; align-items:flex-end; padding:0 14px 10px; z-index:100; }
  .word { font-size:20px; font-weight:800; letter-spacing:.5px; }
  .pane { position:absolute; top:0; left:0; right:0; z-index:99; pointer-events:none; }
  .pane i { position:absolute; inset:0; display:block; }

  /* A: current production recipe — 4 masked layers, pane = header height */
  #A .pane { height: var(--h); }
  #A .pane i:nth-child(1){ -webkit-backdrop-filter:blur(3px);  backdrop-filter:blur(3px);
    -webkit-mask:linear-gradient(to bottom,#000 0%,#000 55%,transparent 82%); mask:linear-gradient(to bottom,#000 0%,#000 55%,transparent 82%);}
  #A .pane i:nth-child(2){ -webkit-backdrop-filter:blur(7px);  backdrop-filter:blur(7px);
    -webkit-mask:linear-gradient(to bottom,#000 0%,#000 40%,transparent 66%); mask:linear-gradient(to bottom,#000 0%,#000 40%,transparent 66%);}
  #A .pane i:nth-child(3){ -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    -webkit-mask:linear-gradient(to bottom,#000 0%,#000 27%,transparent 50%); mask:linear-gradient(to bottom,#000 0%,#000 27%,transparent 50%);}
  #A .pane i:nth-child(4){ -webkit-backdrop-filter:blur(28px) saturate(1.5); backdrop-filter:blur(28px) saturate(1.5);
    -webkit-mask:linear-gradient(to bottom,#000 0%,#000 14%,transparent 30%); mask:linear-gradient(to bottom,#000 0%,#000 14%,transparent 30%);}

  /* B: ONE unmasked blur, no gradient at all */
  #B .pane { height: var(--h); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); }

  /* C: no blur at all — solid bar */
  #C .pane { height: var(--h); background:#0A0A0A; }

  /* D: blur + a faint fill under it */
  #D .pane { height: var(--h); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); background:rgba(10,10,10,.55); }
</style></head><body>
<div class="page">
  <p style="padding:0 14px 10px;color:#9aa">Scroll each box: which one keeps KOLEEX hub crisp?</p>

  <div class="case"><div class="caseLabel">A — what the Hub ships now (4 masked blur layers)</div>
    <div class="win" id="A"><div class="content">
      <div class="stripe"></div><div class="stripe"></div><div class="stripe"></div></div>
      <div class="pane"><i></i><i></i><i></i><i></i></div>
      <div class="hdr"><span class="word">KOLEEX hub</span></div></div></div>

  <div class="case"><div class="caseLabel">B — one plain blur, no mask</div>
    <div class="win" id="B"><div class="content">
      <div class="stripe"></div><div class="stripe"></div><div class="stripe"></div></div>
      <div class="pane"></div>
      <div class="hdr"><span class="word">KOLEEX hub</span></div></div></div>

  <div class="case"><div class="caseLabel">C — no blur, solid bar</div>
    <div class="win" id="C"><div class="content">
      <div class="stripe"></div><div class="stripe"></div><div class="stripe"></div></div>
      <div class="pane"></div>
      <div class="hdr"><span class="word">KOLEEX hub</span></div></div></div>

  <div class="case"><div class="caseLabel">D — blur + faint fill</div>
    <div class="win" id="D"><div class="content">
      <div class="stripe"></div><div class="stripe"></div><div class="stripe"></div></div>
      <div class="pane"></div>
      <div class="hdr"><span class="word">KOLEEX hub</span></div></div></div>
</div></body></html>
